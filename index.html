<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>aths.gr</title>
  <meta name="description" content="aths.gr is under construction.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 4rem 1.5rem;
    }

    .art {
      display: block;
      width: min(100%, 1100px);
      height: auto;
      animation: appear 1.2s ease-out 0.2s both;
    }

    footer {
      padding: 1.75rem 1.5rem;
      text-align: center;
      color: #fff;
    }

    /* Loading bar: pieces appear one by one, from the first to the last */
    .loading .seg { visibility: hidden; }
    .loading .seg.on { visibility: visible; }

    /* Circle: slow, steady clockwise turn around its own centre */
    .ring {
      transform-origin: 1620px 256.7px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    main { overflow: hidden; }

    /* Selection-box frame around the artwork, with dashed guide lines */
    .frame {
      position: relative;
      width: min(100%, 1160px);
      padding: clamp(14px, 3vw, 36px);
      border: 2px solid #666;
      animation: appear 0.6s ease-out 0.5s both;
    }

    .frame .art { width: 100%; }

    .guide {
      position: absolute;
      pointer-events: none;
    }

    .guide-h {
      left: 50%;
      width: 400vw;
      margin-left: -200vw;
      border-top: 2px dashed rgba(255, 255, 255, 0.5);
      transform-origin: center;
      animation: draw-x 1.1s cubic-bezier(.6, 0, .2, 1) both;
    }
    .guide-h.top { top: -2px; }
    .guide-h.bottom { bottom: -2px; }

    .guide-v {
      top: -200vh;
      bottom: -200vh;
      border-left: 2px dashed rgba(255, 255, 255, 0.5);
      transform-origin: center;
      animation: draw-y 0.9s cubic-bezier(.6, 0, .2, 1) 0.25s both;
    }
    .guide-v.left { left: -2px; }
    .guide-v.right { right: -2px; }

    .handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #000;
      border: 2px solid #666;
      transform: translate(-50%, -50%);
      animation: appear 0.4s ease-out 0.7s both;
    }
    .handle.tl { top: 0; left: 0; }
    .handle.tr { top: 0; left: 100%; }
    .handle.bl { top: 100%; left: 0; }
    .handle.br { top: 100%; left: 100%; }

    @keyframes draw-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes draw-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }

    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    /* Contact line: Oswald, a condensed font in the style of Bebas Neue
       that also has lowercase letters */
    .contact {
      font-family: "Oswald", "Arial Narrow", sans-serif;
      font-weight: 400;
      font-size: 1.2rem;
      letter-spacing: 0.03em;
      color: #fff;
      text-decoration: none;
    }

    /* Copyright line: regular sans-serif */
    .copy {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }
    .contact:hover { text-decoration: underline; text-underline-offset: 3px; }
    .contact:focus-visible { outline: 1px solid #fff; outline-offset: 4px; }

    /* Texture, in two layers over the whole page:
       1. inverted texture, multiplied: gives every white element a printed, worn look
          (multiplying over black leaves black unchanged)
       2. original texture, lighten: shows the texture on the black background only,
          because the white elements are always lighter than it */
    .texture {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: url("texture.jpg") center / cover no-repeat;
    }
    .texture-ink {
      z-index: 10;
      filter: invert(1);
      mix-blend-mode: multiply;
    }
    .texture-bg {
      z-index: 11;
      mix-blend-mode: lighten;
    }

    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .art, .ring, .frame, .guide-h, .guide-v, .handle { animation: none; }
    }
  </style>
</head>

  <script>
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var art = document.querySelector(".art");
      var segs = art.querySelectorAll(".seg");
      var STEP = 375;    // time between pieces while loading (ms)
      var BLINK = 450;   // how long the last piece stays on, then off (ms)
      var BLINKS = 3;    // how many times it blinks before the bar resets
      var REST = 900;    // pause with the bar empty before the next round

      var ring = art.querySelector(".ring");
      art.classList.add("loading");

      function run() {
        // stop at 85% of the bar
        var stop = Math.round(segs.length * 0.85);
        var n = 0;

        // the circle makes exactly one clockwise turn from the start of loading
        // until the moment the bar resets
        var turn = stop * STEP + BLINK * (2 * BLINKS + 1);
        ring.style.animation = "none";
        void ring.getBoundingClientRect();   // restart the animation cleanly
        ring.style.animation = "spin " + turn + "ms linear";

        (function fill() {
          segs[n].classList.add("on");
          n++;
          if (n < stop) setTimeout(fill, STEP);
          else setTimeout(function () { blink(segs[stop - 1], BLINKS); }, STEP);
        })();
      }

      // the last piece switches off and on without progressing
      function blink(seg, times) {
        seg.classList.remove("on");
        setTimeout(function () {
          seg.classList.add("on");
          if (times > 1) setTimeout(function () { blink(seg, times - 1); }, BLINK);
          else setTimeout(reset, BLINK * 2);
        }, BLINK);
      }

      function reset() {
        segs.forEach(function (s) { s.classList.remove("on"); });
        setTimeout(run, REST);
      }

      setTimeout(run, 800);
    })();
  </script>
